<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Corporate Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Executive Gold Gradient (Refined, Metallic, Luxury) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Tech Precision Cyan Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Corporate Squircle Frame -->
  <rect x="25" y="25" width="450" height="450" rx="95" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <rect x="36" y="36" width="428" height="428" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.35" />

  <!-- Monogram & Mobility Crest -->
  <g transform="translate(135, 110)">
    <!-- Interlocking Hexagonal Crest / Shield -->
    <polygon points="115,0 215,55 215,165 115,220 15,165 15,55" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" opacity="0.9" />

    <!-- Stylized Modern Fleet Highway / Velocity Arrows -->
    <path d="M 75,175 L 115,80 L 155,175" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 95,175 L 115,130 L 135,175" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sleek Aerodynamic Sedan Profile Monogram Inside Crest -->
    <path d="M 60,110 
             C 70,82, 100,75, 115,75 
             C 130,75, 160,82, 170,110 
             L 182,122 
             C 185,125, 185,130, 180,132 
             L 50,132 
             C 45,130, 45,125, 48,122 Z" 
          fill="url(#goldGrad)" filter="url(#softGlow)" />

    <!-- Executive Monogram HB (Harsh Barot) Center Accent -->
    <text x="115" y="118" fill="#070c18" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="3">HB</text>
  </g>

  <!-- Precision Star / Seal Details -->
  <circle cx="170" cy="355" r="3" fill="#38bdf8" />
  <circle cx="330" cy="355" r="3" fill="#38bdf8" />

  <!-- Professional Typography -->
  <text x="250" y="378" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="29" letter-spacing="2" text-anchor="middle">
    BAROT <tspan fill="url(#goldGrad)">MOBILITY</tspan>
  </text>
  
  <text x="250" y="408" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12.5" letter-spacing="3.5" text-anchor="middle">
    FLEET &amp; WEALTH MANAGEMENT
  </text>

  <!-- Gujarati Subtitle -->
  <text x="250" y="432" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" letter-spacing="1.5" text-anchor="middle">
    બારોટ મોબિલિટી • કલોલ, ગાંધીનગર
  </text>
</svg>
