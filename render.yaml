services:
  - type: web
    name: barot-mobility
    runtime: node
    plan: free
    buildCommand: ./build.sh
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: barotharsh729@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLIENT_ORIGIN
        value: https://barot-mobility.onrender.com
